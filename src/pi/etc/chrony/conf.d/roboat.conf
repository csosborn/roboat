# GPS time from the RP2040, fed by roboat-monitor (src/pi/monitor/timesync.py)
# from each live GPS message. Without a PPS signal it's good to roughly 0.1 s,
# so the large delay keeps internet NTP preferred whenever it's reachable.
# Offline, this is the only source; chrony.conf's "makestep 1 3" then lets it
# step a clock that fake-hwclock restored to the last shutdown time.
refclock SOCK /run/chrony.rp2040.sock refid GPS precision 0.05 delay 0.4 poll 2
